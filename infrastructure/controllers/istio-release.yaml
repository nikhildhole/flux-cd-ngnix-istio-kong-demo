apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 1h0m0s
  url: https://istio-release.storage.googleapis.com/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: flux-system
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: base
      version: "1.21.0"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  targetNamespace: istio-system
  install:
    createNamespace: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: "1.21.0"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  targetNamespace: istio-system
  install:
    createNamespace: true
  values:
    meshConfig:
      # Enable access logging for debugging
      accessLogFile: /dev/stdout
      # Default config for TCP services
      defaultConfig:
        holdApplicationUntilProxyStarts: true
    pilot:
      # Enable support for TCP services
      env:
        PILOT_ENABLE_PROTOCOL_SNIFFING_FOR_OUTBOUND: "true"
        PILOT_ENABLE_PROTOCOL_SNIFFING_FOR_INBOUND: "true"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: istiod
  chart:
    spec:
      chart: gateway
      version: "1.21.0"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  targetNamespace: istio-system
  install:
    createNamespace: true


