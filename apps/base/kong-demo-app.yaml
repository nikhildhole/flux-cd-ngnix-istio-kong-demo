apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-demo
  template:
    metadata:
      labels:
        app: kong-demo
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:latest
        args:
          - "-text=Hello from Kong API Gateway!"
          - "-listen=:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kong-demo
  namespace: demo
spec:
  selector:
    app: kong-demo
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-demo
  namespace: demo
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: kong-rate-limiting, kong-cors
spec:
  ingressClassName: kong
  rules:
  - host: kong-demo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-demo
            port:
              number: 80
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: kong-rate-limiting
  namespace: demo
config:
  minute: 10
  policy: local
plugin: rate-limiting
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: kong-cors
  namespace: demo
config:
  origins:
  - "*"
  methods:
  - GET
  - POST
  headers:
  - Accept
  - Authorization
  - Content-Type
  exposed_headers:
  - X-Auth-Token
  credentials: true
  max_age: 3600
plugin: cors
